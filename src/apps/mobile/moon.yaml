$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  name: 'mobile'
  description: 'Raising Atlantic React Native Expo App'

tasks:
  install:
    command: 'npm install --legacy-peer-deps'

  dev:
    # Triggers 'npm run dev' which is mapped to 'expo start'
    command: 'npm run dev'
    options:
      persistent: true

  ios:
    # Start Metro bundler and open the iOS Simulator
    command: 'npm run ios'
    options:
      persistent: true

  android:
    # Start Metro bundler and open the Android Emulator
    command: 'npm run android'
    options:
      persistent: true

  build:
    # Standard expo web export or EAS pre-flight
    command: 'npx expo export'
    inputs:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'tsconfig.json'
      - 'assets/**/*'
    outputs:
      - 'dist'

  lint:
    # Typecheck as a basic lint step. `types:install` runs first so that
    # `zod` is resolvable when tsc walks into `pkgs/types/src/*.ts` via the
    # `@raising-atlantic/types` path alias.
    command: 'npx tsc --noEmit'
    deps:
      - 'types:install'
    inputs:
      - '**/*.{ts,tsx}'
      - 'tsconfig.json'

  test:
    command: 'npx jest'
    inputs:
      - 'auth/**/*'
      - 'lib/**/*'
      - 'jest.config.js'
      - 'jest.setup.ts'

  e2e:
    # Maestro E2E — needs a booted device/emulator with the app installed.
    # Framework decision: docs/adr/0005-mobile-e2e-framework.md. Local: moon run mobile:e2e
    command: 'maestro test .maestro/flows'
    options:
      runInCI: false

  e2e-smoke:
    # Smoke-tagged subset, driven explicitly by the gated CI job (like cypress:open,
    # this stays runInCI:false because GitHub-hosted runners have no device by default).
    command: 'maestro test .maestro/flows --include-tags smoke --format junit'
    options:
      runInCI: false

  clean:
    command: 'rm -rf .expo node_modules dist'
