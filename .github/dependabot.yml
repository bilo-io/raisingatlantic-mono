version: 2

# Every entry below sets `target-branch: dev`. The promotion path is
# dev -> test -> main and only hotfixes go straight to main, so a dependency
# bump opened against the default branch would bypass the pipeline entirely.
# Keep target-branch on any new ecosystem added here.

updates:
  # ── Application code: npm workspaces ────────────────────────────────────────
  - package-ecosystem: npm
    directory: /src/apps/api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, api]

  - package-ecosystem: npm
    directory: /src/apps/web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, web]

  - package-ecosystem: npm
    directory: /src/apps/mobile
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, mobile]

  - package-ecosystem: npm
    directory: /src/pkgs/ui
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, pkgs]

  - package-ecosystem: npm
    directory: /src/pkgs/types
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, pkgs]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, root]

  # ── CI / Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  # ── Infrastructure as Code ──────────────────────────────────────────────────
  - package-ecosystem: terraform
    directory: /infra
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, infra]

  # ── Container images ────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /src/apps/api
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker, api]

  - package-ecosystem: docker
    directory: /src/apps/web
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker, web]
