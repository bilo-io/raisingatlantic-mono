name: CI

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/apps/api/package-lock.json
            src/apps/web/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install deps
        run: moon run :install
      - name: Lint
        run: moon run :lint

  # ── API Tests ─────────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: raisingatlantic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/apps/api/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install API deps
        run: moon run api:install
      - name: Run API unit tests with coverage
        run: moon run api:test-cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/raisingatlantic
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: raisingatlantic
          DB_USER: postgres
          DB_PASS: postgres
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: src/apps/coverage
          retention-days: 14
      - name: Run API e2e smoke (no-DB harness)
        run: moon run api:test-e2e
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret

  # ── Web Tests (Vitest) ────────────────────────────────────────────────────
  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install web deps
        run: moon run web:install
      - name: Run web tests
        run: moon run web:test

  # ── Mobile Tests (jest-expo) ──────────────────────────────────────────────
  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/apps/mobile/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install mobile deps
        run: moon run mobile:install
      - name: Run mobile tests
        run: moon run mobile:test

  # ── Web Build ─────────────────────────────────────────────────────────────
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/pkgs/ui/package-lock.json
            src/pkgs/types/package-lock.json
            src/apps/web/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install deps
        run: moon run ui:install types:install web:install
      - name: Build shared packages
        run: moon run ui:build types:build
      - name: Build web
        run: moon run web:build
        env:
          NEXT_PUBLIC_USE_API: "false"

  # ── Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/apps/api/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install API deps
        run: moon run api:install
      - name: Typecheck API
        run: moon run api:typecheck

  # ── Security Audit ────────────────────────────────────────────────────────
  # Advisory in Phase 5.1: the audit runs across every workspace and the findings
  # are visible in the Actions UI as workflow annotations, but the check stays green.
  # Pre-existing transitive vulnerabilities in OpenTelemetry/GCP deps (web) and Expo
  # (mobile) need to be triaged and upgraded in a follow-up before this can be made
  # blocking (drop the `exit 0` in the audit step).
  security-audit:
    name: Security Audit (${{ matrix.workspace.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - { name: api, path: src/apps/api }
          - { name: web, path: src/apps/web }
          - { name: mobile, path: src/apps/mobile }
          - { name: ui, path: src/pkgs/ui }
          - { name: types, path: src/pkgs/types }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.workspace.path }}/package-lock.json
      - name: Install deps
        working-directory: ${{ matrix.workspace.path }}
        # Match the project-wide install strategy (moon: `npm install --legacy-peer-deps`).
        # `npm ci` rejects pre-existing lockfile drift / peer conflicts that the rest of
        # the toolchain accepts, which would fail this job before the audit even runs.
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Audit dependencies (advisory)
        working-directory: ${{ matrix.workspace.path }}
        # Advisory: surface findings via a workflow annotation but always exit 0,
        # so the check reads green while the report stays visible. Promote to a
        # blocking gate once the existing transitive vulns are triaged.
        run: |
          set +e
          npm audit --audit-level=high --omit=dev
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::npm audit reported high+ findings in ${{ matrix.workspace.name }} (advisory in Phase 5.1; see job log)"
          fi
          exit 0

  # ── Mobile Typecheck ──────────────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/apps/mobile/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install mobile deps
        run: moon run mobile:install
      - name: Typecheck mobile
        run: moon run mobile:lint

  # ── EAS Preview Build (optional — needs EXPO_TOKEN) ───────────────────────
  # NOTE: job IDs cannot contain spaces (GitHub Actions limitation). The previous
  # `EAS Preview:` key (with a space) caused the entire workflow file to fail to
  # parse — every CI run on `dev` since 2026-05-21 reported zero jobs. Renamed
  # to `eas-preview`; the display name still goes through `name:`.
  eas-preview:
    name: EAS Preview
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check EXPO_TOKEN availability
        id: check_token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN not configured — skipping EAS preview build"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check_token.outputs.has_token == 'true'
        with:
          node-version: 20
      - name: Install Expo CLI + EAS CLI
        if: steps.check_token.outputs.has_token == 'true'
        run: npm install -g expo-cli eas-cli
      - name: Install mobile deps
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: src/apps/mobile
        run: npm ci --legacy-peer-deps
      - name: Build preview
        if: steps.check_token.outputs.has_token == 'true'
        working-directory: src/apps/mobile
        run: eas build --platform all --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
