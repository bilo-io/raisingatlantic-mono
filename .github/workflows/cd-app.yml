name: CD — App

# Runs on every push to dev / test / main that touches application code.
# Pipeline:  build & push images → trivy scan → SBOM → cosign sign → deploy

on:
  push:
    branches: [dev, test, main]
    paths:
      - 'src/**'
      - 'pkgs/**'
      - 'src/apps/api/Dockerfile'
      - 'src/apps/web/Dockerfile'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight deploy

# ── Resolve per-branch config ──────────────────────────────────────────────
env:
  REGISTRY: africa-south1-docker.pkg.dev
  # PROJECT_ID, ENV_NAME, REGION, and SA are resolved in each job via branch map

jobs:
  # ── 1. Build images, scan, sign, push ────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
      project_id: ${{ steps.meta.outputs.project_id }}
      env_name: ${{ steps.meta.outputs.env_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve env config from branch
        id: meta
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "project_id=ra-dev"      >> "$GITHUB_OUTPUT"
              echo "env_name=dev"           >> "$GITHUB_OUTPUT"
              echo "sa=${{ secrets.APP_SERVICE_ACCOUNT_DEV }}" >> "$GITHUB_OUTPUT"
              ;;
            test)
              echo "project_id=ra-staging"  >> "$GITHUB_OUTPUT"
              echo "env_name=staging"       >> "$GITHUB_OUTPUT"
              echo "sa=${{ secrets.APP_SERVICE_ACCOUNT_STAGING }}" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "project_id=ra-prod"     >> "$GITHUB_OUTPUT"
              echo "env_name=prod"          >> "$GITHUB_OUTPUT"
              echo "sa=${{ secrets.APP_SERVICE_ACCOUNT_PROD }}" >> "$GITHUB_OUTPUT"
              ;;
          esac
          PROJECT_ID=$(grep project_id "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo "api_image=${{ env.REGISTRY }}/${PROJECT_ID}/ra-images/ra-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ env.REGISTRY }}/${PROJECT_ID}/ra-images/ra-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.APP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.meta.outputs.sa }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build API image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha,scope=api \
            --cache-to   type=gha,scope=api,mode=max \
            -f src/apps/api/Dockerfile \
            -t ${{ steps.meta.outputs.api_image }} \
            --load \
            src/apps/api

      - name: Build Web image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha,scope=web \
            --cache-to   type=gha,scope=web,mode=max \
            -f src/apps/web/Dockerfile \
            -t ${{ steps.meta.outputs.web_image }} \
            --load \
            src/apps/web

      - name: Scan API image (block on CRITICAL CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.api_image }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan Web image (block on CRITICAL CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.web_image }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push API image
        run: docker push ${{ steps.meta.outputs.api_image }}

      - name: Push Web image
        run: docker push ${{ steps.meta.outputs.web_image }}

      - name: Generate SBOM — API
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.api_image }}
          format: cyclonedx-json
          output-file: sbom-api.json

      - name: Generate SBOM — Web
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.web_image }}
          format: cyclonedx-json
          output-file: sbom-web.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign API image
        run: cosign sign --yes ${{ steps.meta.outputs.api_image }}

      - name: Sign Web image
        run: cosign sign --yes ${{ steps.meta.outputs.web_image }}

  # ── 2a. Deploy to dev (auto — branch: dev) ────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    needs: build-and-push
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.APP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.APP_SERVICE_ACCOUNT_DEV }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run DB migrations
        run: |
          gcloud run jobs execute ra-migrate-dev \
            --region africa-south1 \
            --project ra-dev \
            --wait \
          || echo "::warning::Migration job not found — skipping (Phase 1 infra not yet bootstrapped)"

      - name: Deploy API
        run: |
          gcloud run deploy ra-api-dev \
            --image ${{ needs.build-and-push.outputs.api_image }} \
            --region africa-south1 \
            --project ra-dev \
            --quiet

      - name: Deploy Web
        run: |
          gcloud run deploy ra-web-dev \
            --image ${{ needs.build-and-push.outputs.web_image }} \
            --region africa-south1 \
            --project ra-dev \
            --quiet

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *deploy → dev* `${{ github.sha }}` by `${{ github.actor }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── 2a-smoke. Cypress smoke → dev ────────────────────────────────────────
  cypress-smoke-dev:
    name: Cypress Smoke → dev
    needs: deploy-dev
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    continue-on-error: true  # soft-fail until dev environment is fully stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/test/cypress/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install Cypress deps
        run: moon run cypress:install
      - name: Run smoke suite
        uses: cypress-io/github-action@v6
        with:
          working-directory: src/test/cypress
          browser: chrome
          config: baseUrl=https://raisingatlantic-web-dev.vercel.app

  # ── 2b. Deploy to staging (auto — branch: test) ───────────────────────────
  deploy-staging:
    name: Deploy → staging
    needs: build-and-push
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.APP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.APP_SERVICE_ACCOUNT_STAGING }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run DB migrations
        run: |
          gcloud run jobs execute ra-migrate-staging \
            --region africa-south1 \
            --project ra-staging \
            --wait \
          || echo "::warning::Migration job not found — skipping"

      - name: Deploy API
        run: |
          gcloud run deploy ra-api-staging \
            --image ${{ needs.build-and-push.outputs.api_image }} \
            --region africa-south1 \
            --project ra-staging \
            --quiet

      - name: Deploy Web
        run: |
          gcloud run deploy ra-web-staging \
            --image ${{ needs.build-and-push.outputs.web_image }} \
            --region africa-south1 \
            --project ra-staging \
            --quiet

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *deploy → staging* `${{ github.sha }}` by `${{ github.actor }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── 2b-smoke. Cypress smoke → staging ────────────────────────────────────
  cypress-smoke-staging:
    name: Cypress Smoke → staging
    needs: deploy-staging
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    continue-on-error: true  # soft-fail until staging environment is fully stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/test/cypress/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install Cypress deps
        run: moon run cypress:install
      - name: Run smoke suite
        uses: cypress-io/github-action@v6
        with:
          working-directory: src/test/cypress
          browser: chrome
          config: baseUrl=https://raisingatlantic-web-test.vercel.app

  # ── 2c. Deploy to prod (manual approval — branch: main) ───────────────────
  deploy-prod:
    name: Deploy → prod
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production  # GitHub Environment — requires reviewer approval

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.APP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.APP_SERVICE_ACCOUNT_PROD }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Capture stable revision (for rollback)
        id: stable
        run: |
          STABLE=$(gcloud run services describe ra-api-prod \
            --region africa-south1 --project ra-prod \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || echo "")
          echo "revision=${STABLE}" >> "$GITHUB_OUTPUT"

      - name: Run DB migrations
        run: |
          gcloud run jobs execute ra-migrate-prod \
            --region africa-south1 \
            --project ra-prod \
            --wait \
          || echo "::warning::Migration job not found — skipping"

      # Canary deploy: new revision gets 0% traffic initially
      - name: Deploy API canary (no traffic)
        run: |
          gcloud run deploy ra-api-prod \
            --image ${{ needs.build-and-push.outputs.api_image }} \
            --region africa-south1 \
            --project ra-prod \
            --no-traffic \
            --tag canary-${{ github.sha }} \
            --quiet

      - name: Route 10% traffic to canary
        run: |
          gcloud run services update-traffic ra-api-prod \
            --region africa-south1 \
            --project ra-prod \
            --to-tags canary-${{ github.sha }}=10

      - name: Wait 5 min and check error rate
        id: canary_check
        run: |
          sleep 300
          # Query 5xx error count over the last 5 minutes; threshold = 5 errors
          ERROR_COUNT=$(gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="ra-api-prod" AND httpRequest.status>=500' \
            --project ra-prod \
            --freshness 5m \
            --format 'value(httpRequest.status)' 2>/dev/null | wc -l | tr -d ' ')
          echo "error_count=${ERROR_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${ERROR_COUNT}" -gt "5" ]; then
            echo "::error::Canary error rate too high (${ERROR_COUNT} 5xx in 5 min) — rolling back"
            exit 1
          fi

      - name: Roll traffic to 50%
        run: |
          gcloud run services update-traffic ra-api-prod \
            --region africa-south1 \
            --project ra-prod \
            --to-tags canary-${{ github.sha }}=50
          sleep 120

      - name: Full cutover (100%)
        run: |
          gcloud run services update-traffic ra-api-prod \
            --region africa-south1 \
            --project ra-prod \
            --to-latest

      - name: Deploy Web
        run: |
          gcloud run deploy ra-web-prod \
            --image ${{ needs.build-and-push.outputs.web_image }} \
            --region africa-south1 \
            --project ra-prod \
            --quiet

      # Rollback on any failure after canary was deployed
      - name: Rollback API on failure
        if: failure() && steps.stable.outputs.revision != ''
        run: |
          echo "Rolling back to ${{ steps.stable.outputs.revision }}"
          gcloud run services update-traffic ra-api-prod \
            --region africa-south1 \
            --project ra-prod \
            --to-revisions ${{ steps.stable.outputs.revision }}=100

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *deploy → prod* `${{ github.sha }}` by `${{ github.actor }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── 2c-smoke. Cypress smoke → prod ───────────────────────────────────────
  cypress-smoke-prod:
    name: Cypress Smoke → prod
    needs: deploy-prod
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/test/cypress/package-lock.json
      - name: Install Moon
        run: npm install -g @moonrepo/cli
      - name: Install Cypress deps
        run: moon run cypress:install
      - name: Run smoke suite
        uses: cypress-io/github-action@v6
        with:
          working-directory: src/test/cypress
          browser: chrome
          config: baseUrl=https://raisingatlantic-web.vercel.app

  # ── 3. Sentry release + source map upload ─────────────────────────────────
  # Tags the release with the Git SHA and uploads source maps for the API
  # (NestJS dist/) and web (Next.js .next/). Web maps are also uploaded by
  # `withSentryConfig` during `next build` when SENTRY_AUTH_TOKEN is set; this
  # job is the authoritative release-tag step + API-side upload.
  #
  # The job is best-effort: it gates on a SENTRY_AUTH_TOKEN secret being
  # present so dev runs without Sentry stay green.
  sentry-release:
    name: Sentry release & source maps
    needs: build-and-push
    if: github.ref_name == 'main' || github.ref_name == 'test'
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - name: Skip if Sentry not configured
        id: gate
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Sentry release — SENTRY_AUTH_TOKEN or SENTRY_ORG not set"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Resolve project slugs from branch
        if: steps.gate.outputs.skip != 'true'
        id: slugs
        run: |
          case "${{ github.ref_name }}" in
            test) echo "api=ra-api-staging" >> "$GITHUB_OUTPUT"; echo "web=ra-web-staging" >> "$GITHUB_OUTPUT" ;;
            main) echo "api=ra-api-prod"    >> "$GITHUB_OUTPUT"; echo "web=ra-web-prod"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build API (for source maps)
        if: steps.gate.outputs.skip != 'true'
        run: bun --filter api run build
        working-directory: .

      - name: Build Web (Next.js auto-uploads maps via withSentryConfig)
        if: steps.gate.outputs.skip != 'true'
        env:
          SENTRY_PROJECT_WEB: ${{ steps.slugs.outputs.web }}
        run: bun --filter web run build

      - name: Install sentry-cli
        if: steps.gate.outputs.skip != 'true'
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Create Sentry release (API)
        if: steps.gate.outputs.skip != 'true'
        env:
          SENTRY_PROJECT: ${{ steps.slugs.outputs.api }}
        run: |
          sentry-cli releases new "$SENTRY_RELEASE"
          sentry-cli releases set-commits "$SENTRY_RELEASE" --auto

      - name: Upload API source maps
        if: steps.gate.outputs.skip != 'true'
        env:
          SENTRY_PROJECT: ${{ steps.slugs.outputs.api }}
        run: |
          sentry-cli releases files "$SENTRY_RELEASE" upload-sourcemaps \
            src/apps/api/dist \
            --rewrite

      - name: Finalize Sentry release (API)
        if: steps.gate.outputs.skip != 'true'
        env:
          SENTRY_PROJECT: ${{ steps.slugs.outputs.api }}
        run: sentry-cli releases finalize "$SENTRY_RELEASE"
