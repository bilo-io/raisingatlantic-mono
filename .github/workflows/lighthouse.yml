name: Lighthouse CI

on:
  pull_request:
    branches: [dev, test, main]
    paths:
      - 'src/apps/web/**'
      - 'src/pkgs/ui/**'
      - 'src/pkgs/types/**'
      - '.lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Moon reads GITHUB_BASE_REF on PRs; needs the full ref to be present

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/pkgs/ui/package-lock.json
            src/pkgs/types/package-lock.json
            src/apps/web/package-lock.json

      - name: Install Moon
        run: npm install -g @moonrepo/cli

      - name: Install deps
        run: moon run pkgs/ui:install pkgs/types:install web:install

      - name: Build shared packages
        run: moon run pkgs/ui:build pkgs/types:build

      - name: Build web (mock mode)
        run: moon run web:build
        env:
          NEXT_PUBLIC_USE_API: 'false'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
