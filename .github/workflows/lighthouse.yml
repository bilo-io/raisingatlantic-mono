name: Lighthouse CI

on:
  pull_request:
    branches: [dev, test, main]
    paths:
      - 'src/apps/web/**'
      - 'src/pkgs/ui/**'
      - 'src/pkgs/types/**'
      - '.lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Moon reads GITHUB_BASE_REF on PRs; needs the full ref to be present

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/pkgs/ui/package-lock.json
            src/pkgs/types/package-lock.json
            src/apps/web/package-lock.json

      - name: Install Moon
        run: npm install -g @moonrepo/cli

      - name: Install deps
        run: moon run ui:install types:install web:install

      - name: Build shared packages
        run: moon run ui:build types:build

      - name: Build web (mock mode)
        run: moon run web:build
        env:
          NEXT_PUBLIC_USE_API: 'false'

      - name: Stage standalone assets
        # Next standalone output (monorepo mode) places server.js at
        # .next/standalone/src/apps/web/server.js but does not copy .next/static
        # or public/ into the standalone tree. Stage them so Lighthouse scores
        # real assets instead of 404s.
        run: |
          set -euo pipefail
          STANDALONE=src/apps/web/.next/standalone/src/apps/web
          test -f "$STANDALONE/server.js" || {
            echo "::error::expected $STANDALONE/server.js missing — Next standalone output path changed?"
            find src/apps/web/.next/standalone -maxdepth 4 -name server.js -print
            exit 1
          }
          cp -r src/apps/web/.next/static "$STANDALONE/.next/static"
          if [ -d src/apps/web/public ]; then
            cp -r src/apps/web/public "$STANDALONE/public"
          fi

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
