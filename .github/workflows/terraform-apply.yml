name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation

jobs:
  # ── Preflight: detect whether Terraform GCP auth is configured ───────────
  # See terraform-plan.yml for the rationale. Gates the whole apply pipeline
  # until Phase 1.2 bootstraps the WIF pool + provider.
  # TODO(GCP): set TF_WORKLOAD_IDENTITY_PROVIDER in repo secrets once Phase
  # 1.2 lands (docs/GO_LIVE/DEV.md §1.4) — the preflight becomes a no-op.
  preflight:
    name: Preflight (Terraform secrets check)
    runs-on: ubuntu-latest
    outputs:
      gcp_configured: ${{ steps.check.outputs.gcp_configured }}
    steps:
      - id: check
        env:
          WIF_PROVIDER: ${{ secrets.TF_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -n "$WIF_PROVIDER" ]; then
            echo "gcp_configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Terraform GCP auth configured — running apply pipeline."
          else
            echo "gcp_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Terraform Apply — TF_WORKLOAD_IDENTITY_PROVIDER not set. Bootstrap Phase 1.2 (docs/GO_LIVE/DEV.md §1.4) to enable applies."
          fi

  apply-dev:
    name: Apply — dev
    needs: preflight
    if: needs.preflight.outputs.gcp_configured == 'true'
    runs-on: ubuntu-latest
    environment: dev  # TODO(OPS): create "dev" GitHub Environment (Settings → Environments)

    defaults:
      run:
        working-directory: infra/envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      # TODO(GCP): requires TF_WORKLOAD_IDENTITY_PROVIDER + TF_SERVICE_ACCOUNT_DEV
      # repo secrets (Phase 1.2). Whole job is gated by the preflight check.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TF_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT_DEV }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var-file=terraform.tfvars
        env:
          TF_VAR_github_token: ${{ secrets.GH_TOKEN_TERRAFORM }}
          TF_VAR_stripe_api_key: ${{ secrets.STRIPE_API_KEY_DEV }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
          TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TF_VAR_sendgrid_api_key: ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_betterstack_api_token: ${{ secrets.BETTERSTACK_API_TOKEN }}
          TF_VAR_pagerduty_token: ${{ secrets.PAGERDUTY_TOKEN }}

      - name: Notify Slack — dev applied
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *Terraform apply — dev* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          # TODO(OPS): add SLACK_WEBHOOK_URL to GitHub Secrets (Settings → Secrets)
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  apply-staging:
    name: Apply — staging
    runs-on: ubuntu-latest
    needs: apply-dev
    environment: staging  # TODO(OPS): create "staging" GitHub Environment

    defaults:
      run:
        working-directory: infra/envs/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      # TODO(GCP): requires TF_WORKLOAD_IDENTITY_PROVIDER + TF_SERVICE_ACCOUNT_STAGING
      # repo secrets (Phase 1.2). Cascade-skipped when apply-dev is skipped.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TF_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT_STAGING }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var-file=terraform.tfvars
        env:
          TF_VAR_github_token: ${{ secrets.GH_TOKEN_TERRAFORM }}
          TF_VAR_stripe_api_key: ${{ secrets.STRIPE_API_KEY_STAGING }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
          TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TF_VAR_sendgrid_api_key: ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_betterstack_api_token: ${{ secrets.BETTERSTACK_API_TOKEN }}
          TF_VAR_pagerduty_token: ${{ secrets.PAGERDUTY_TOKEN }}

      - name: Notify Slack — staging applied
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *Terraform apply — staging* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  apply-prod:
    name: Apply — prod
    runs-on: ubuntu-latest
    needs: apply-staging
    # MANUAL GATE: prod requires a human to approve before applying.
    # TODO(OPS): create "production" GitHub Environment with required reviewers:
    #   Settings → Environments → New environment → "production"
    #   → Required reviewers: add yourself (Bilo Lwabona)
    environment: production

    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      # TODO(GCP): requires TF_WORKLOAD_IDENTITY_PROVIDER + TF_SERVICE_ACCOUNT_PROD
      # repo secrets (Phase 1.2). Cascade-skipped when apply-staging is skipped.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TF_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT_PROD }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (pre-apply confirmation)
        run: terraform plan -input=false -var-file=terraform.tfvars -no-color
        env:
          TF_VAR_github_token: ${{ secrets.GH_TOKEN_TERRAFORM }}
          TF_VAR_stripe_api_key: ${{ secrets.STRIPE_API_KEY_PROD }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
          TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TF_VAR_sendgrid_api_key: ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_betterstack_api_token: ${{ secrets.BETTERSTACK_API_TOKEN }}
          TF_VAR_pagerduty_token: ${{ secrets.PAGERDUTY_TOKEN }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var-file=terraform.tfvars
        env:
          TF_VAR_github_token: ${{ secrets.GH_TOKEN_TERRAFORM }}
          TF_VAR_stripe_api_key: ${{ secrets.STRIPE_API_KEY_PROD }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
          TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TF_VAR_sendgrid_api_key: ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_betterstack_api_token: ${{ secrets.BETTERSTACK_API_TOKEN }}
          TF_VAR_pagerduty_token: ${{ secrets.PAGERDUTY_TOKEN }}

      - name: Notify Slack — prod applied
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *Terraform apply — PROD* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
